[project]
name = "agentic-trading-desk"
version = "0.1.0"
description = "A multi-agent trading desk that trades on a C++ order-book simulator through MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "claude-agent-sdk>=0.2.163",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
